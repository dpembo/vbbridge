name: VBBridge
version: '1.0.1'
main: uk.globeworks.vbbridge.VBBridgePlugin
api-version: '1.21'
author: dpembo
description: Relays a backend command to VelocityBroadcast's /vb on the proxy.

commands:
  netbroadcast:
    description: Broadcast a message network-wide via VelocityBroadcast
    usage: /netbroadcast <message>
    permission: vbbridge.use
  vbbridge:
    description: VBBridge admin commands (debug, reload, handshake)
    usage: /vbbridge <debug|reload|handshake|version> [args]
    permission: vbbridge.debug

permissions:
  vbbridge.use:
    description: Allows triggering a network-wide broadcast
    default: op
  vbbridge.debug:
    description: Allows toggling debug logging
    default: op
  vbbridge.reload:
    description: Allows reloading the VBBridge config
    default: op
  vbbridge.handshake:
    description: Allows running a manual version handshake with the proxy
    default: op
